<aside class="sidebar">

  <div class="sidebar-top">

    <div class="sidebar-logo">
      <a routerLink="/dashboard">PM Sistem</a>
    </div>

    @if (korisnik) {
      <div class="sidebar-user">
        Zdravo, <strong>{{ korisnik.korisnickoIme }}</strong>
      </div>
    }

    <nav class="sidebar-nav">

      <a routerLink="/dashboard"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{ exact: true }">
        Dashboard
      </a>

      <a routerLink="/moji-projekti" routerLinkActive="active">
        Moji projekti
      </a>

      @if (korisnik?.isAdmin) {
        <a routerLink="/admin/projekti/novi" routerLinkActive="active" class="admin-link">
          Novi projekat
        </a>
      }

      <!-- Zadaci, Resursi, Profil — coming soon -->

    </nav>

  </div>

  <div class="sidebar-bottom">
    <button class="logout-btn" (click)="odjava()">
      Odjava
    </button>
  </div>

</aside>

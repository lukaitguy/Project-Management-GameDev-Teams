<section class="add-build-page">

  <div class="page-header">
    <div>
      <h1>Dodavanje novog builda</h1>
      <p>Unesite podatke o novoj verziji projekta.</p>
    </div>

    <a class="back-link" [routerLink]="['/projekti', projekatId, 'buildovi']">
      Nazad na buildove
    </a>
  </div>

  <div class="form-card">
    <form [formGroup]="buildForm" (ngSubmit)="onSubmit()" class="build-form">

      <div class="form-group">
        <label for="verzija">Verzija</label>
        <input id="verzija" type="text" formControlName="verzija" placeholder="npr. 1.0.1" />

        @if (buildForm.get('verzija')?.touched && buildForm.get('verzija')?.invalid) {
          <small class="error-text">Verzija builda je obavezna.</small>
        }
      </div>

      <div class="form-group">
        <label for="nazivBuilda">Naziv builda</label>
        <input id="nazivBuilda" type="text" formControlName="nazivBuilda" placeholder="npr. Hotfix Build" />
      </div>

      <div class="form-group">
        <label for="tipBuilda">Tip builda</label>
        <input id="tipBuilda" type="text" formControlName="tipBuilda" placeholder="npr. Alpha, Beta, Release" />
      </div>

      <div class="form-group">
        <label for="patchNapomene">Patch napomene</label>
        <textarea id="patchNapomene" rows="6" formControlName="patchNapomene" placeholder="Unesite izmene i ispravke u ovom buildu"></textarea>
      </div>

      @if (greska) {
        <p class="error-text">{{ greska }}</p>
      }

      @if (uspeh) {
        <p class="success-text">{{ uspeh }}</p>
      }

      <div class="form-actions">
        <button type="submit" [disabled]="loading">
          {{ loading ? 'Čuvanje...' : 'Sačuvaj build' }}
        </button>
      </div>

    </form>
  </div>

</section>

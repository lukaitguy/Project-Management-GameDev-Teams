<section class="user-form-page">

  <div class="page-header">
    <div>
      <h1>Izmena korisnika</h1>
      <p>Promena podataka, uloga i lozinke.</p>
    </div>
    <a class="back-link" routerLink="/admin/korisnici">Nazad</a>
  </div>

  <div class="form-card">

    <div class="form-section">
      <h2>Nalog</h2>
      <div class="form-row">
        <div class="form-group">
          <label>Korisničko ime *</label>
          <input type="text" [(ngModel)]="form.userName" />
        </div>
        <div class="form-group">
          <label>Email *</label>
          <input type="email" [(ngModel)]="form.email" />
        </div>
      </div>
    </div>

    <div class="form-section">
      <h2>Profil</h2>
      <div class="form-row">
        <div class="form-group">
          <label>Ime</label>
          <input type="text" [(ngModel)]="form.ime" />
        </div>
        <div class="form-group">
          <label>Prezime</label>
          <input type="text" [(ngModel)]="form.prezime" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Broj telefona</label>
          <input type="text" [(ngModel)]="form.brojTelefona" />
        </div>
      </div>
      <div class="form-group">
        <label>Biografija</label>
        <textarea rows="3" [(ngModel)]="form.biografija"></textarea>
      </div>
    </div>

    <div class="form-section">
      <h2>Uloge</h2>
      <div class="roles-list">
        @for (role of roles; track role) {
          <label class="role-checkbox" [class.selected]="isRoleSelected(role)">
            <input type="checkbox" [checked]="isRoleSelected(role)" (change)="toggleRole(role)" />
            {{ role }}
          </label>
        }
      </div>
    </div>

    @if (greska)  { <p class="error">{{ greska }}</p> }
    @if (uspeh)   { <p class="success">{{ uspeh }}</p> }

    <div class="form-actions">
      <button (click)="sacuvaj()" [disabled]="loading">
        {{ loading ? 'Cuvanje...' : 'Sacuvaj izmene' }}
      </button>
    </div>

  </div>

  <div class="form-card">

    <div class="form-section">
      <h2>Promena lozinke</h2>
      <div class="form-row">
        <div class="form-group">
          <label>Nova lozinka</label>
          <input type="password" [(ngModel)]="novaLozinka" placeholder="Min. 6 znakova" />
        </div>
      </div>
    </div>

    @if (greskeLozinka)  { <p class="error">{{ greskeLozinka }}</p> }
    @if (uspehLozinka)   { <p class="success">{{ uspehLozinka }}</p> }

    <div class="form-actions">
      <button (click)="promeniLozinku()" [disabled]="loadingLozinka">
        {{ loadingLozinka ? 'Menjanje...' : 'Promeni lozinku' }}
      </button>
    </div>

  </div>

</section>

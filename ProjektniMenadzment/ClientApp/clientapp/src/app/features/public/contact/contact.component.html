<section class="page-section">
  <div class="container">
    <h1>Kontakt</h1>
    <p>Za sva pitanja ili sugestije možete nas kontaktirati putem forme ispod.</p>

    <form class="contact-form">
      <div class="form-group">
        <label for="ime">Ime i prezime</label>
        <input id="ime" type="text" placeholder="Unesite ime i prezime" />
      </div>

      <div class="form-group">
        <label for="email">Email adresa</label>
        <input id="email" type="email" placeholder="Unesite email adresu" />
      </div>

      <div class="form-group">
        <label for="poruka">Poruka</label>
        <textarea id="poruka" rows="5" placeholder="Unesite poruku"></textarea>
      </div>

      <button type="submit">Pošalji</button>
    </form>
  </div>
</section>
